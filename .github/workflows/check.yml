name: check

on:
  push:
    branches: ["claude/**"]
  workflow_dispatch:
    inputs:
      selftest:
        description: "Run the module self-test (about 6 minutes)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wine:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      MONCHI_CI_SELFTEST: ${{ inputs.selftest && '1' || '' }}
      MONCHI_CI_SCRIPT: "6:k:161;8:c:380,343;9.5:c:700,126;12:c:380,275;14:c:380,122;17:c:380,100;18:c:721,124;20:t:107;20.3:t:101;20.6:t:121;23:k:27;24:w:380,400"
      MONCHI_CI_SHOTS: "7 11 13 16 19 22 25"
      MONCHI_CI_TOUR: "1"
    steps:
      - uses: actions/checkout@v4

      - name: toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++-mingw-w64-x86-64-posix wine64 xvfb imagemagick libgl1-mesa-dri xdotool

      - name: build and screenshots
        run: tools/ci.sh "$RUNNER_TEMP/out"

      - name: publish results
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="ci-results/${GITHUB_REF_NAME//\//-}"
          cd "$RUNNER_TEMP/out"
          echo "$GITHUB_SHA" > commit.txt
          git init -q
          git config user.name "monchi-ci"
          git config user.email "monchi-ci@users.noreply.github.com"
          git checkout -q -b "$branch"
          git add -A
          git commit -qm "ci results for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$branch"
