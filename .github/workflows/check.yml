name: check

on:
  push:
    branches: ["claude/**"]
  workflow_dispatch:
    inputs:
      selftest:
        description: "Run the module self-test (about 6 minutes)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wine:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      MOCHI_CI_SELFTEST: ${{ inputs.selftest && '1' || '' }}
      MOCHI_CI_SCRIPT: "6:k:161;9:c:708,200;12:c:708,276;16:k:27;17:c:290,238;21:c:290,266;25:c:450,139;26:t:122;26.3:t:111;26.6:t:111;27:t:109"
      MOCHI_CI_SHOTS: "4 8 11 14 19 23 29"
    steps:
      - uses: actions/checkout@v4

      - name: toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++-mingw-w64-x86-64-posix wine64 xvfb imagemagick libgl1-mesa-dri

      - name: build and screenshots
        run: tools/ci.sh "$RUNNER_TEMP/out"

      - name: publish results
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="ci-results/${GITHUB_REF_NAME//\//-}"
          cd "$RUNNER_TEMP/out"
          echo "$GITHUB_SHA" > commit.txt
          git init -q
          git config user.name "mochi-ci"
          git config user.email "mochi-ci@users.noreply.github.com"
          git checkout -q -b "$branch"
          git add -A
          git commit -qm "ci results for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$branch"
